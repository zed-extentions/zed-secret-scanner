[package]
name = "secret-scanner-lsp"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false
description = "Language server that reports hardcoded secrets as diagnostics."

[[bin]]
name = "secret-scanner-lsp"
path = "src/main.rs"

[dependencies]
crossbeam-channel = "0.5"
lsp-server = "0.7"
lsp-types = "0.95"
secret-scanner-core = { path = "../secret-scanner-core" }
serde_json = "1.0"

[lints.rust]
unsafe_code = "forbid"
